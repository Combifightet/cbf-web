[translations.en]
title = "Don't worry about me"
text = '''
Don't worry about me, I'll be fine.
Just don't look into my eyes.'''

[translations.de]
title = "Mach dir keine Sorgen um mich"
text = '''
Mach dir keine Sorgen um mich, mir wird es gut gehen.
Sieh mir nur nicht in die Augen.'''