[translations.de]
title = "Sprich mit mir"
text = '''
Sprich mit mir,
wie du mit
dem dunklen
und leeren Raum
um 3 Uhr
morgens sprichst,
frei und ehrlich.'''

[translations.en]
title = "Talk to me"
text = '''
Talk to me,
the way you talk
to the dark
and empty room
at 3 a.m.,
freely and honestly.'''