[translations.en]
title = "My feelings"
text = '''
And sometimes I have kept my feelings to myself,
because I could find no language to describe them in.'''

[translations.de]
title = "Meine Gefühle"
text = '''
Und manchmal habe ich meine Gefühle für mich behalten,
weil ich keine Sprache fand, um sie zu beschreiben.'''