[translations.en]
title = "The rarity of living"
text = '''
To live is the rarest thing in the world.
Most people exist, that is all.'''

[translations.de]
title = "Die Seltenheit des Lebens"
text = '''
Leben ist das Seltenste auf der Welt.
Die meisten Menschen existieren nur.'''